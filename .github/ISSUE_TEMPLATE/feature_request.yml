name: Feature request
description: Suggest an idea, a new tool, or a workflow Legion should support.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain. Not the proposed solution yet.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like Legion to solve it. Be concrete if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried as a workaround
